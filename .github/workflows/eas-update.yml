name: EAS OTA update

# Every push to main publishes an over-the-air update, so an already-installed
# app picks up the change on its next launch with no rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    name: Publish update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # An OTA update reaches installed apps without any review step, so it
      # runs the same checks a pull request would get.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Publish
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          eas update \
            --branch production \
            --message "${{ github.event.head_commit.message || 'Manual update' }}" \
            --non-interactive

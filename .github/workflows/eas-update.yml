name: EAS OTA update

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      branch:
        description: EAS update branch
        required: true
        default: preview
        type: choice
        options: [preview, production]

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Publish update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # An OTA update reaches users without review, so it never ships without
      # the same checks a PR would get.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Resolve target channel
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "branch=production" >> "$GITHUB_OUTPUT"
          else
            echo "branch=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          eas update \
            --branch "${{ steps.target.outputs.branch }}" \
            --message "${{ github.event.head_commit.message || 'Manual update' }}" \
            --non-interactive

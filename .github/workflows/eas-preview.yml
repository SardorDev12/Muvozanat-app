name: EAS native build

# Manual only. A native build takes 10-20 minutes and consumes EAS build
# credits, and most changes reach an installed app as an over-the-air update
# without one. Run this from the Actions tab when you need a fresh installable
# app: after adding a native library, changing app.json, or setting up a new
# device.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options: [all, android, ios]
      profile:
        description: Build profile
        required: true
        default: preview
        type: choice
        options: [preview, production, development]

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # A native build is slow and expensive, so it is not worth starting one
      # from code that would have failed CI.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Start build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          eas build \
            --profile "${{ inputs.profile }}" \
            --platform "${{ inputs.platform }}" \
            --non-interactive \
            --no-wait

      - name: Where to find it
        run: |
          echo "### Build started" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Follow it on the [EAS dashboard](https://expo.dev/accounts). When it" >> "$GITHUB_STEP_SUMMARY"
          echo "finishes you get a QR code and an install link." >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Web export (build smoke test)
        # Dummy Supabase values: the export only needs the env vars to exist,
        # and nothing in a static export talks to the network.
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npx expo export --platform web --output-dir dist

  schema:
    name: Schema tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Applies every migration in order to a real Postgres and asserts the
      # behaviour typechecking cannot see: that triggers fire, that the
      # completion rollup reaches goals, and that RLS actually isolates users.
      - name: Apply migrations and assert
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: scripts/test-schema.sh

  worker:
    name: Worker typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/reminders
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/reminders/package-lock.json

      - run: npm ci
      - run: npm run typecheck

name = "muvozanat-reminders"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Once a day at 06:00 UTC. The job is idempotent — it skips anyone who already
# has an open nudge — so a missed or repeated run is harmless.
[triggers]
crons = ["0 6 * * *"]

[observability]
enabled = true

# SUPABASE_URL is injected at deploy time from the EXPO_PUBLIC_SUPABASE_URL
# repository secret (see .github/workflows/deploy-worker.yml), so there is one
# source of truth and no placeholder that can quietly ship to production.
# For `wrangler dev`, put it in a git-ignored .dev.vars file instead.
#
# The real secrets are set once in the Cloudflare dashboard, under
# Workers & Pages -> muvozanat-reminders -> Settings -> Variables and Secrets:
#   SUPABASE_SERVICE_ROLE_KEY   (required)
#   ADMIN_TRIGGER_SECRET        (optional; enables POST /run)
